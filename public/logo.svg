<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" role="img" aria-label="Stickerly">
  <defs>
    <linearGradient id="peelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="75%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Sticker peel curl on the letter S -->
  <path d="M22 56 C18 56, 14 53, 13 49 C12 45, 15 42, 18 42 C22 42, 26 45, 26 50 C27 54, 24 56, 22 56 Z" fill="url(#peelGradient)" />
  <path d="M22 56 C20 58, 16 58, 14 55 C12 53, 12 49, 14 47" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />

  <!-- Wordmark -->
  <text
    x="36"
    y="62"
    font-family="ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="60"
    font-weight="800"
    fill="#0f172a"
    style="letter-spacing: -0.02em;"
  >
    Stickerly
  </text>

  <!-- Rainbow star above the i -->
  <path
    d="M102 16 L105 24 L113 24 L107 29 L109 37 L102 32 L95 37 L97 29 L91 24 L99 24 Z"
    fill="url(#starGradient)"
    stroke="white"
    stroke-width="2"
    stroke-linejoin="round"
  />
</svg>
